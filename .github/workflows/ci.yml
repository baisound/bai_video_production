name: Fast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Verify media executables
        run: |
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install bounded parallel-test tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          pytest-xdist==3.8.0 pytest-timeout==2.4.0
      - name: Run changed and corresponding tests
        run: >-
          python tools/ci/run-fast-tests.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --allowed-temp-root "${{ runner.temp }}"
          --basetemp "${{ runner.temp }}/bvp-fast-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: python -m compileall -q src tests
