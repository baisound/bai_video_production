name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "ffmpeg.8.1.2.nupkg"
          curl.exe --silent --show-error --fail --location `
            --output $package `
            "https://packages.chocolatey.org/ffmpeg.8.1.2.nupkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "6c5746c8f0da8334d367131012ec1280bdd490651e108c35e19933587b06aed8"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg package checksum mismatch" }
          choco install ffmpeg --version=8.1.2 --source="$env:RUNNER_TEMP" --yes --no-progress
      - name: Verify media executables
        run: |
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
