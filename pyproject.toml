[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-production"
version = "0.1.0"
description = "Foundation contracts for the AI video production automation system"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
