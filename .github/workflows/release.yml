name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag, for example v0.7.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python -m build
      - name: Verify tag matches package version
        shell: bash
        run: test "${{ inputs.tag }}" = "v$(python -c 'import ai_video_production; print(ai_video_production.__version__)')"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" dist/* --verify-tag --generate-notes --title "BAI Video Production ${{ inputs.tag }}"
