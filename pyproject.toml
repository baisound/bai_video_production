[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-production"
version = "0.21.0"
description = "Open, provider-neutral orchestration for safe and reproducible AI video production"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "baisound" }]
keywords = ["ai", "video", "media", "automation", "davinci-resolve", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.urls]
Homepage = "https://github.com/baisound/bai_video_production"
Repository = "https://github.com/baisound/bai_video_production"
Issues = "https://github.com/baisound/bai_video_production/issues"
Changelog = "https://github.com/baisound/bai_video_production/blob/main/CHANGELOG.md"

[project.scripts]
ai-video-resolve-probe = "ai_video_production.resolve_probe_cli:main"
ai-video-ingest = "ai_video_production.ingest_cli:main"
ai-video-normalize = "ai_video_production.normalization_cli:main"
ai-video-comfy-capability = "ai_video_production.comfyui_cli:main"
ai-video-openvino-audio-capability = "ai_video_production.audacity_openvino_cli:main"
ai-video-openvino-audio-behavior-probe = "ai_video_production.audacity_openvino_behavior_cli:main"
ai-video-quickstart = "ai_video_production.quickstart_cli:main"
ai-video-settings = "ai_video_production.connection_settings_web:main"
ai-video-transcribe = "ai_video_production.transcription_cli:main"
ai-video-subtitle-workspace = "ai_video_production.subtitle_workspace_web:main"
ai-video-resolve-subtitle-handoff = "ai_video_production.resolve_subtitle_handoff_cli:main"
ai-video-cut-candidates = "ai_video_production.cut_candidate_cli:main"
ai-video-dbd-trivia-editor = "ai_video_production.dbd_trivia_editor:main"
ai-video-dbd-training-studio = "ai_video_production.dbd_training_studio:main"
ai-video-dbd-kamigame-collect = "ai_video_production.dbd_kamigame_cli:main"
ai-video-faster-whisper-evidence = "ai_video_production.faster_whisper_reconciliation_cli:main"
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
asr = ["faster-whisper>=1.2.1,<2"]
windows-build = [
  "pyinstaller==6.22.0",
  "pywebview==6.2.1",
  "faster-whisper>=1.2.1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
ai_video_production = ["schema_resources/*.json", "workflow_resources/*.json"]
