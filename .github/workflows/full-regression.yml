name: Full regression

on:
  workflow_call:
    inputs:
      ref:
        description: Exact branch, commit, or annotated tag to test
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, commit, or annotated tag; empty uses the current ref
        required: false
        default: ""
        type: string
  push:
    branches:
      - "integration/**"
      - "release/**"
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: identity
        shell: bash
        run: |
          commit_sha=$(git rev-parse --verify 'HEAD^{commit}')
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-ref
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.commit_sha }}
      - name: Verify immutable checkout
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-ref.outputs.commit_sha }}
        run: test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Prepare exclusive full-regression operation root
        id: operation_root
        shell: bash
        run: >-
          python tools/ci/run-fast-tests.py --prepare-only
          --allowed-temp-root "${{ runner.temp }}"
          --basetemp "${{ runner.temp }}/bvp-full-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.python-version }}"
          | tee -a "$GITHUB_OUTPUT"
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BVP_OPERATION_ROOT: ${{ steps.operation_root.outputs.operation_root }}
        run: |
          $package = Join-Path $env:BVP_OPERATION_ROOT "ffmpeg.8.1.2.nupkg"
          python tools/ci/run-fast-tests.py --check-child --allowed-temp-root "$env:BVP_OPERATION_ROOT" --basetemp "$package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe --silent --show-error --fail --location `
            --output $package `
            "https://packages.chocolatey.org/ffmpeg.8.1.2.nupkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "6c5746c8f0da8334d367131012ec1280bdd490651e108c35e19933587b06aed8"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg package checksum mismatch" }
          choco install ffmpeg --version=8.1.2 --source="$env:BVP_OPERATION_ROOT" --yes --no-progress
      - name: Verify media executables
        run: |
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install bounded parallel-test tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          pytest-xdist==3.8.0 pytest-timeout==2.4.0
      - name: Run bounded parallel test suite on Linux
        if: runner.os == 'Linux'
        env:
          BVP_OPERATION_ROOT: ${{ steps.operation_root.outputs.operation_root }}
        run: |
          python tools/ci/run-fast-tests.py --check-child --allowed-temp-root "$BVP_OPERATION_ROOT" --basetemp "$BVP_OPERATION_ROOT/parallel"
          python -m pytest -q -n 2 --dist loadfile \
            --timeout=120 --max-worker-restart=0 --durations=20 \
            --basetemp "$BVP_OPERATION_ROOT/parallel"
      - name: Run bounded parallel non-installer suite on Windows
        if: runner.os == 'Windows'
        env:
          BVP_OPERATION_ROOT: ${{ steps.operation_root.outputs.operation_root }}
        run: |
          python tools/ci/run-fast-tests.py --check-child --allowed-temp-root "$env:BVP_OPERATION_ROOT" --basetemp "$env:BVP_OPERATION_ROOT/parallel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -n 2 --dist loadfile `
            --timeout=120 --max-worker-restart=0 --durations=20 `
            --basetemp "$env:BVP_OPERATION_ROOT/parallel" `
            --ignore=tests/test_task047_obs_installer_contract.py
      - name: Run native installer contract serially on Windows
        if: runner.os == 'Windows'
        env:
          BVP_OPERATION_ROOT: ${{ steps.operation_root.outputs.operation_root }}
        run: |
          python tools/ci/run-fast-tests.py --check-child --allowed-temp-root "$env:BVP_OPERATION_ROOT" --basetemp "$env:BVP_OPERATION_ROOT/installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_task047_obs_installer_contract.py `
            --timeout=300 --durations=20 `
            --basetemp "$env:BVP_OPERATION_ROOT/installer"
      - run: python -m compileall -q src tests
