name: Bug report
description: Report a reproducible defect without including secrets or private media.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, tokens, personal data, and private media from this report.
          required: true
  - type: input
    attributes:
      label: Version
      placeholder: "0.6.7"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python version, editor/runtime versions, and relevant provider (without credentials).
    validations:
      required: true
