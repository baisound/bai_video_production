name: Monthly release readiness

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const title = `[Release readiness] ${month}`;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title \"${title}\"`
            });
            if (data.total_count === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ["release"],
                body: "- [ ] User-visible changes documented\n- [ ] Full CI and Security green\n- [ ] Version/changelog/citation synchronized\n- [ ] Demo and migration path verified\n- [ ] Real impact Evidence updated without invented metrics\n- [ ] Maintainer explicitly approves release"
              });
            }
