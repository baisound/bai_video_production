name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing released version tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
