[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-production"
version = "0.2.4"
description = "Consumer-project foundation and DaVinci Resolve capability spike tooling"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.scripts]
ai-video-resolve-probe = "ai_video_production.resolve_probe_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
ai_video_production = ["schema_resources/*.json"]
