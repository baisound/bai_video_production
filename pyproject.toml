[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-production"
version = "0.4.0"
description = "AI video production foundation with secure ingest, media normalization, and local AI runtime adapters"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.scripts]
ai-video-resolve-probe = "ai_video_production.resolve_probe_cli:main"
ai-video-ingest = "ai_video_production.ingest_cli:main"
ai-video-normalize = "ai_video_production.normalization_cli:main"
ai-video-comfy-capability = "ai_video_production.comfyui_cli:main"
ai-video-openvino-audio-capability = "ai_video_production.audacity_openvino_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
ai_video_production = ["schema_resources/*.json"]
